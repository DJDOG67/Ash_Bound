name: probe
on: push
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - run: ./gradlew --no-daemon compileJava -x compileJava || true
      - run: |
          J=$(find ~/.gradle build -name "*.jar" 2>/dev/null | while read f; do unzip -l "$f" 2>/dev/null | grep -q "net/minecraft/world/entity/LivingEntity.class" && echo "$f"; done | head -1)
          echo "JAR=$J"
          C=$(unzip -l "$J" | grep -o "[^ ]*SwingAnimation[^ ]*\.class" | head -5); echo "$C"
          for c in $C; do javap -cp "$J" "${c%.class}" | head -40; done
          javap -cp "$J" net.minecraft.world.entity.LivingEntity | grep -i "swing"
          javap -cp "$J" net.minecraft.world.item.ItemStack | grep -i "swing"
