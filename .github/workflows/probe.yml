name: probe
on: push
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - run: ./gradlew --no-daemon compileJava || true
      # Usage: put the classes to inspect in CLASSES below, commit with "[probe]" in the message.
      - run: |
          J=$(find ~/.gradle build -name "*.jar" 2>/dev/null | while read f; do unzip -l "$f" 2>/dev/null | grep -q "net/minecraft/world/entity/LivingEntity.class" && echo "$f"; done | head -1)
          echo "JAR=$J"
          CLASSES="net.minecraft.world.entity.LivingEntity"
          for c in $CLASSES; do javap -cp "$J" "$c"; done
